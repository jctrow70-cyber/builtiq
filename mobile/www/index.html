<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>BuildIQ Health Dev</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0a0f18;
        color: #e8eef8;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #9aa8bd;
        line-height: 1.45;
        max-width: 28rem;
      }
      code {
        font-size: 0.85em;
        color: #7eb6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BuildIQ Health Dev</h1>
      <p>
        Capacitor local shell (MOB-01). For the development WebView bridge, set
        <code>BUILDIQ_MOBILE_SERVER_URL</code> or <code>mobile/dev-target.json</code>
        to a Vercel Preview deployment that uses the development Supabase project,
        then run <code>npx cap sync</code>.
      </p>
    </main>
  </body>
</html>
